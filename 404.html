<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>公式サイトをリニューアルしました | 岡山県統一模擬試験（おかもし）</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <!-- Google tag (gtag.js) 即時計測後にトップページへ引き継ぎ遷移（404計測消失の防止） -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=GT-NBJ63L9J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    (function() {
      var missingPath = window.location.pathname || '/404.html';
      var searchStr = window.location.search || '';
      var fullMissing = missingPath + searchStr;
      var redirected = false;
      function redirectToHome() {
        if (redirected) return;
        redirected = true;
        if (missingPath !== '/' && missingPath !== '/index.html') {
          window.location.replace('/?from_404=' + encodeURIComponent(fullMissing));
        }
      }
      gtag('config', 'GT-NBJ63L9J', {
        page_path: fullMissing,
        page_title: '404 Not Found'
      });
      gtag('event', 'page_not_found', {
        missing_path: fullMissing
      });
      if (missingPath !== '/' && missingPath !== '/index.html') {
        setTimeout(redirectToHome, 1200);
      }
    })();
  </script>
  <!-- Tailwind CSS (ビルド済み静的CSS) -->
  <link rel="stylesheet" href="/css/style.min.css">
  <link id="google-fonts-sans" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=home&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <meta http-equiv="refresh" content="2; url=/">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=home&display=swap" rel="stylesheet">
  </noscript>
  <style id="perf-cls-composited-fix">
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased;width:1em;height:1em;overflow:hidden;vertical-align:middle}
    .transition-all{transition-property:color,background-color,border-color,text-decoration-color,fill,stroke,opacity,transform!important}
  </style>
</head>
<body class="bg-[#F1F5F9] text-slate-800 min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="max-w-md w-full bg-white rounded-lg shadow-sm border border-slate-200/90 p-8 text-center space-y-5">
    <div class="w-16 h-16 rounded-full bg-slate-100 text-emerald-950 flex items-center justify-center mx-auto">
      <span class="material-symbols-outlined text-4xl">home</span>
    </div>
    <div class="space-y-2">
      <h1 class="text-xl font-bold text-slate-900">公式サイトをリニューアルしました</h1>
      <p class="text-sm text-slate-600 leading-relaxed">
        公式サイトをリニューアルしました。トップページへ移動します…
      </p>
    </div>
    <div class="pt-2">
      <a href="/" class="inline-flex items-center justify-center gap-2 w-full py-3.5 px-6 rounded-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold text-sm shadow-sm transition-all">
        <span class="material-symbols-outlined text-base">home</span>
        <span>トップページへ移動する</span>
      </a>
    </div>
  </div>
</body>
</html>
