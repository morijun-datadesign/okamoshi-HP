name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (static checks & AI rules sync)
        run: |
          node scripts/quality-gate/static-checks.mjs
          node scripts/sync-ai-rules.mjs --check

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Build test (Cloudflare Pages Functions)
        run: npm run build:functions
