<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>模試お申込みフォームへ移動中 | 岡山県統一模擬試験（おかもし）</title>
  <script>
    (function() {
      var path = window.location.pathname || '';
      if (path === '/apply' || path === '/apply/') return;
      var s = window.location.search || '';
      var h = window.location.hash || '';
      window.location.replace('/apply' + s + h);
    })();
  </script>
</head>
<body>
  <p>模試お申込みフォームへ移動しています... <a href="/apply">自動的に移動しない場合はこちらをクリックしてください</a></p>
</body>
</html>
