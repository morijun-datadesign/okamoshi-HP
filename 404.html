  <script>
    window.dataLayer = window.dataLayer || [];

    window.clarity = window.clarity || function(){(window.clarity.q = window.clarity.q || []).push(arguments);};
    (function() {
      var analyticsLoaded = false;
      var fontsLoaded = false;
      function loadFonts() {
        if (fontsLoaded) return;
        fontsLoaded = true;
        var f = document.getElementById('google-fonts-sans');
        if (f && f.getAttribute('data-href') && !f.getAttribute('href')) {
          f.setAttribute('href', f.getAttribute('data-href'));
        }
      }
      function loadAnalytics() {
        loadFonts();
        if (analyticsLoaded) return;
        analyticsLoaded = true;
        var g = document.createElement('script');
        g.async = true;
        g.src = 'https://www.googletagmanager.com/gtag/js?id=GT-NBJ63L9J';
        document.head.appendChild(g);
        var c = document.createElement('script');
        c.async = true;
        c.src = 'https://www.clarity.ms/tag/z5nnqjwyks';
        document.head.appendChild(c);
      }
      function scheduleIdleLoad() {
        var ric = window.requestIdleCallback || function(cb) { return setTimeout(cb, 1); };
        setTimeout(function() {
          ric(loadAnalytics, { timeout: 2000 });
        }, 3500);
      }
      ['scroll', 'pointerdown', 'keydown', 'touchstart'].forEach(function(ev) {
        window.addEventListener(ev, function() {
          var ric = window.requestIdleCallback || function(cb) { return setTimeout(cb, 1); };
          ric(loadAnalytics, { timeout: 1000 });
        }, { once: true, passive: true });
      });
      if (document.readyState === 'complete') {
        scheduleIdleLoad();
      } else {
        window.addEventListener('DOMContentLoaded', function() {
          window.addEventListener('load', scheduleIdleLoad, { once: true });
        }, { once: true });
      }
    })();
  </script>
