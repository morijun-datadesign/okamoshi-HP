<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>模試お申込みフォームへ移動中 | 岡山県統一模擬試験（おかもし）</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <script>
    (function() {
      var path = window.location.pathname || '';
      if (path === '/apply' || path === '/apply/') return;
      var s = window.location.search || '';
      var h = window.location.hash || '';
      window.location.replace('/apply' + s + h);
    })();
  </script>
  <style id="perf-cls-composited-fix">
    .material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased;width:1em;height:1em;overflow:hidden;vertical-align:middle}
    .transition-all{transition-property:color,background-color,border-color,text-decoration-color,fill,stroke,opacity,transform!important}
  </style>
</head>
<body>
  <p>模試お申込みフォームへ移動しています... <a href="/apply">自動的に移動しない場合はこちらをクリックしてください</a></p>
</body>
</html>
