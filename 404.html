<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません | 岡山県統一模擬試験（おかもし）</title>
  <script>
    (function() {
      var path = window.location.pathname || '';
      // 1. ループ防止ガード：すでにルート、404、index.html、完了画面の場合はリダイレクトしない
      if (path === '/' || path === '/index.html' || path === '/404.html' || path === '/404' || path.startsWith('/apply/success')) {
        return;
      }
      // 2. /lp/lp/... など lp の連鎖、または /lp へのアクセスを検知した場合はトップへ安全に転送
      if (path.includes('/lp') || path.startsWith('/lp')) {
        window.location.replace('/index.html');
        return;
      }
      // 3. /apply へのアクセスは /apply.html へ安全に転送
      if (path === '/apply' || path === '/apply/') {
        window.location.replace('/apply.html' + window.location.search + window.location.hash);
        return;
      }
    })();
  </script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center space-y-5">
    <div class="w-16 h-16 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center mx-auto">
      <span class="material-symbols-outlined text-4xl">search_off</span>
    </div>
    <div class="space-y-2">
      <h1 class="text-xl font-bold text-slate-900">ページが見つかりませんでした</h1>
      <p class="text-sm text-slate-600 leading-relaxed">
        お探しのページは移動または削除されたか、URLが一時的に変更された可能性があります。
      </p>
    </div>
    <div class="pt-2">
      <a href="/index.html" class="inline-flex items-center justify-center gap-2 w-full py-3.5 px-6 rounded-full bg-emerald-800 hover:bg-emerald-900 text-white font-bold text-sm shadow-md transition-all">
        <span class="material-symbols-outlined text-base">home</span>
        <span>トップページへ戻る</span>
      </a>
    </div>
  </div>
</body>
</html>
